<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Panel</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="wrap">

<div class="side">
<h2>Bottle Pixel Admin</h2>
<a href="/chat.html">Chat</a>
<a href="/account.html">Account</a>
<a href="/logout">Logout</a>
</div>

<div class="main">

<h1>Admin Dashboard</h1>

<div class="card">
<h3>Announcement</h3>
<input id="announceText" placeholder="Write announcement">
<button onclick="sendAnnouncement()">Post</button>
</div>

<div class="card">
<h3>Users</h3>
<div id="usersList">Loading...</div>
</div>

<div class="card">
<h3>Ranks</h3>
<input id="rankUser" placeholder="Username">
<select id="rankRole">
<option value="user">User</option>
<option value="mod">Moderator</option>
<option value="admin">Admin</option>
<option value="vip+">Vip+</option>
<option value="legendry+">Lengendry+</option>
</select>
<button onclick="setRank()">Update Rank</button>
</div>

</div>

</div>

<script src="admin.js"></script>
</body>
</html>
